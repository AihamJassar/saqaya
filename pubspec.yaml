name: saqaya
description: A professional water delivery Flutter application.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # الخرائط المجانية (OpenStreetMap)
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.3.0
  provider: ^6.0.5
  intl: ^0.20.2
  cupertino_icons: ^1.0.5
  flutter_map_cancellable_tile_provider: ^1.0.0
  geolocator: ^13.0.1
  # Firebase Dependencies
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_database: ^12.2.0
  firebase_messaging: ^16.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # إذا كان لديك صور أو خطوط أضفها هنا تحت قسم assets
